
name: Build Kernel A10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Checkout kernel source
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: kho447520/android_kernel_samsung_exynos7885
          ref: Hi
          fetch-depth: 1

      # Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu git gnupg gperf \
            imagemagick libncurses-dev libssl-dev \
            libelf-dev liblz4-tool zip unzip

      # Configure and build
      - name: Build Kernel
        run: |
          set -e

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos7885_defconfig

          ./scripts/kconfig/merge_config.sh \
            -m .config \
            arch/arm64/configs/a10.config

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" Image

          test -s arch/arm64/boot/Image

      # Download AnyKernel3 packaging source
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/Roynas-Android-Playground/kernel_packaging_anykernel3.git \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/tools/ak3-core.sh

      # Configure AnyKernel3 for A10
      - name: Configure AnyKernel3
        run: |
          cat > AnyKernel3/anykernel.sh << 'EOF'
          #!/sbin/sh

          properties() { '
          kernel.string=Exynos7885 Kernel for Samsung A10
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a10
          '; }

          boot_attributes() {
            :
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          chmod 755 AnyKernel3/anykernel.sh

      # Copy kernel Image
      - name: Copy Kernel Image
        run: |
          set -e

          cp arch/arm64/boot/Image AnyKernel3/Image

          ls -lh AnyKernel3/Image

      # Package ZIP
      - name: Package Kernel ZIP
        run: |
          set -e

          cd AnyKernel3

          zip -r9 ../Kernel-A10-Exynos7885.zip . \
            -x ".git/*" ".git*" "README.md"

          cd ..

          unzip -t Kernel-A10-Exynos7885.zip

          ls -lh Kernel-A10-Exynos7885.zip

      # Upload one artifact
      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A10-Exynos7885
          path: Kernel-A10-Exynos7885.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: Hi
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libelf-dev

      - name: Build Kernel
        env:
          KCONFIG_ALLCONFIG: "1"
        run: |
          # Configure the kernel for the target device.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- exynos7885_defconfig

          # Merge the A10-specific options and normalize the configuration.
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/a10.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          # Build with the installed ARM64 cross-compiler.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: arch/arm64/boot/Image

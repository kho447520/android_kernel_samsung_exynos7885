
name: Build Kernel A10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Checkout source
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: Hi
          fetch-depth: 1

      # Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            zip \
            unzip

      # Build kernel
      - name: Build Kernel
        run: |
          set -e

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos7885_defconfig

          ./scripts/kconfig/merge_config.sh \
            -m .config \
            arch/arm64/configs/a10.config

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" Image

          test -f arch/arm64/boot/Image

      # Prepare AnyKernel3
      - name: Prepare AnyKernel3
        run: |
          set -e

          if [ ! -f AnyKernel3/anykernel.sh ]; then
            echo "ERROR: AnyKernel3/anykernel.sh not found!"
            exit 1
          fi

          cp arch/arm64/boot/Image AnyKernel3/Image

          if [ -f arch/arm64/boot/dtb ]; then
            cp arch/arm64/boot/dtb AnyKernel3/dtb
          fi

          echo "Kernel Image prepared successfully"

      # Package ZIP
      - name: Package Kernel
        run: |
          set -e

          cd AnyKernel3

          zip -r9 ../Kernel-A10-Exynos7885.zip . \
            -x "*.git*" "*.md"

          cd ..

          unzip -t Kernel-A10-Exynos7885.zip

          echo "ZIP package created successfully"

      # Upload final ZIP
      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A10-Exynos7885
          path: Kernel-A10-Exynos7885.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
